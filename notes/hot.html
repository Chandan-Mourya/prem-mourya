<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Hot Questions · Notes</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-filter="hot">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-link" href="index.html"><i class="bi bi-arrow-left"></i> <span>All notes</span></a>
      <div class="search-wrap">
        <i class="bi bi-search"></i>
        <input id="search" type="search" placeholder="Search hot questions..." autocomplete="off" spellcheck="false">
        <span class="search-shortcut">/</span>
      </div>
      <div class="topbar-actions">
        <button class="action-btn" id="expandAll"><i class="bi bi-arrows-expand"></i> Expand</button>
        <button class="action-btn" id="collapseAll"><i class="bi bi-arrows-collapse"></i> Collapse</button>
      </div>
    </div>
  </header>

  <main class="topic-page">

    <div class="topic-page-header">
      <div class="topic-page-eyebrow">Cross-topic · Hot</div>
      <h1>Hot Questions</h1>
      <p class="topic-page-desc">The ones that come up most often — pulled live from every topic page. Each entry links back to its source topic for the full context.</p>
      <div class="topic-page-meta">
        <span><strong id="count">…</strong> questions</span>
        <span>Press <span class="hint-kbd">/</span> to search</span>
      </div>
    </div>

    <div class="no-results" id="noResults">No matches.</div>

    <div class="filter-loader" id="loader">
      <i class="bi bi-arrow-repeat"></i> Loading hot questions from every topic…
    </div>

    <div class="qa-list" id="qaList"></div>

  </main>

  <script src="main.js"></script>
  <script src="filtered.js"></script>
</body>
</html>
